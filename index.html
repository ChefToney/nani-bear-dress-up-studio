<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8c8ef"><title>Nani Bear Dress-Up Studio</title><link rel="stylesheet" href="style.css?v=6"></head>
<body>
<section id="intro" class="intro"><video id="introVideo" autoplay muted playsinline loop><source src="press%20start.MP4" type="video/mp4"></video><div class="intro-shade"></div><div class="intro-copy"><p class="eyebrow">WELCOME TO</p><h1>Nani Bear<br><span>Dress-Up Studio</span></h1><button id="startBtn" class="big-button">LET'S PLAY! ✨</button></div></section>
<main id="studio" class="studio" hidden><header><div><p class="eyebrow">YOUR LITTLE FASHION WORLD</p><h1>🐻 Nani Bear Dress-Up Studio</h1></div><div class="music-controls"><button id="prevTrack" aria-label="Previous track">⏮</button><button id="playPause" aria-label="Play or pause">⏸</button><button id="nextTrack" aria-label="Next track">⏭</button><button id="muteBtn" aria-label="Mute">🔊</button></div></header>
<div class="workspace"><aside class="sidebar"><h2>Choose a scene</h2><div id="backgrounds" class="background-list"></div><hr><h2>Dress Nani</h2><nav id="categories" class="category-list"></nav><div id="items" class="item-list"></div><button id="resetBtn" class="reset">Reset outfit</button></aside><section class="stage-wrap"><div id="stage" class="stage"><img id="scene" class="scene" alt="Selected background"><div id="characterLayer" class="character-layer"></div></div><p class="hint">Tap an item to add it. Tap it again to remove it. 💖</p></section></div></main>
<audio id="music" preload="none"></audio><script src="game.js?v=4"></script></body></html>
